[package]
name = "banana-desktop"
description = "Banana Pepper desktop frontend (egui)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
banana-api.workspace = true
banana-compat.workspace = true
# Packing writes at the official zstd level (C libzstd); reading stays pure Rust.
banana-content = { workspace = true, features = ["zstd"] }
banana-core.workspace = true
banana-input.workspace = true
banana-runtime.workspace = true
banana-settings.workspace = true
eframe.workspace = true
serde_json.workspace = true
rfd = "0.17.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3.20.0"

[[bin]]
# Stable binary name used by shortcuts and documentation.
name = "arcade-desktop"
path = "src/main.rs"

[[package.metadata.banana.artifacts]]
name="arcade-desktop"
kind="bin"
target=""
hosts=["windows", "linux"]
destination="arcade-desktop{exe}"
