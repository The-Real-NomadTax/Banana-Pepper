# The Super Cars Wine hook is a freestanding 32-bit Windows DLL: no MSVC
# toolchain or CRT is needed, only LLVM's lld-link.
[target.i686-pc-windows-msvc]
linker = "lld-link"
rustflags = [
    "-C", "panic=abort",
]

# Android 15+ checks ELF load-segment alignment even on 4 KiB devices.
[target.aarch64-linux-android]
rustflags = [
    "-C", "link-arg=-Wl,-z,max-page-size=16384",
    "-C", "link-arg=-Wl,-z,common-page-size=16384",
]
