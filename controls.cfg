# Arcade Foundry desktop controls. Edit here or in the workbench's Controls panel.
# Separate multiple keys with commas. Escape always exits a game.

[aliens]  # Aliens Armageddon. Mouse aim and fire use the game's own desktop mouse controls. One key per action.
start1 = 1  # Player 1 Start / menu confirm
start2 = 2  # Player 2 Start
coin1 = 5  # Coin 1
coin2 = 6  # Coin 2
test = T  # Test (operator menu) / menu select
service = 9  # Service / menu back
volume_up = Up  # Volume up / menu up
volume_down = Down  # Volume down / menu down

[jurassic]  # Jurassic Park 2015. Mouse movement always aims for player one.
start1 = 1  # Player 1 Start
start2 = 2  # Player 2 Start
coin1 = 5  # Coin 1
coin2 = 6  # Coin 2
test = T  # Test (operator menu)
service = 9  # Service
menu_up = Up  # Menu up
menu_down = Down  # Menu down
menu_select = Enter  # Menu select
menu_back = Backspace  # Menu back
fire = MouseLeft  # Fire (player one)
secondary = MouseRight  # Secondary trigger

[big_buck]  # Big Buck Hunter Pro. Left mouse fires and right mouse pumps. Letters, digits, Space, Enter, Tab, Backspace and punctuation only.
start1 = 1, Enter  # Player 1 Start
start2 = 2  # Player 2 Start
coin1 = 5  # Coin 1
coin2 = 6  # Coin 2
test = T  # Test (operator menu)
service = 9  # Service
trigger = Space  # Trigger switch (keyboard)
