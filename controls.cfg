# Banana pepper desktop controls. Edit here or in the workbench's Controls panel.
# Separate multiple keys with commas. Escape always exits a game.

[aliens]  # Aliens Armageddon. Aim and fire use the game's own desktop mouse controls for the keyboard-and-mouse player. One key per action (plus any controller buttons). Controllers: either stick moves the aim, RT/LT fire (left/right click for the mouse's player, Q/W for the other).
start1 = 1, PadStart, PadA  # Player 1 Start / menu confirm
start2 = 2  # Player 2 Start
coin1 = 5, PadBack  # Coin 1
coin2 = 6  # Coin 2
test = T  # Test (operator menu) / menu select
service = 9, PadB  # Service / menu back
volume_up = Up, PadUp  # Volume up / menu up
volume_down = Down, PadDown  # Volume down / menu down
move_x = AxisLX, AxisRX  # Aim X (right) (controller axes: AxisLX/LY/RX/RY/LT/RT, PointerX/Y; - inverts)
move_y = AxisLY, AxisRY  # Aim Y (down) (controller axes: AxisLX/LY/RX/RY/LT/RT, PointerX/Y; - inverts)

[jurassic]  # Jurassic Park 2015. The mouse aims for the keyboard-and-mouse player (player one unless player two picks it). Controllers: either stick moves the aim. Mice and light guns on Raw Input aim their own player directly.
start1 = Enter, PadStart  # Player 1 Start
start2 = 2  # Player 2 Start
coin1 = 5, PadBack  # Coin 1
coin2 = 6  # Coin 2
test = T, PadLeft  # Test (operator menu)
service = Y, PadRight  # Service
menu_up = Up, PadUp  # Menu up
menu_down = Down, PadDown  # Menu down
menu_select = 1, PadA  # Menu select
menu_back = Backspace, PadB  # Menu back
fire = MouseLeft, PadRT  # Fire (player one)
secondary = MouseRight, PadLT  # Secondary trigger
move_x = AxisLX  # Aim X (right) (controller axes: AxisLX/LY/RX/RY/LT/RT, PointerX/Y; - inverts)
move_y = AxisLY  # Aim Y (down) (controller axes: AxisLX/LY/RX/RY/LT/RT, PointerX/Y; - inverts)

[jurassic.p2]  # Player two's own controls. Delete this section to use player one's controller buttons.
start1 = PadStart  # Player 1 Start
start2 =   # Player 2 Start
coin1 = PadBack  # Coin 1
coin2 =   # Coin 2
test =   # Test (operator menu)
service =   # Service
menu_up = PadUp  # Menu up
menu_down = PadDown  # Menu down
menu_select = PadA  # Menu select
menu_back = PadB  # Menu back
fire = Space, PadRT  # Fire (player one)
secondary = PadLT  # Secondary trigger
move_x = AxisLX, AxisRX  # Aim X (right)
move_y = AxisLY, AxisRY  # Aim Y (down)

[big_buck]  # Big Buck Hunter Pro. Left mouse fires and right mouse pumps for the keyboard-and-mouse player. Letters, digits, Space, Enter, Tab, Backspace and punctuation only. Controllers: either stick moves the crosshair. Mice and light guns on Raw Input aim their own gun directly.
start1 = 1, Enter, PadStart  # Player 1 Start
start2 = 2  # Player 2 Start
coin1 = 5, PadBack  # Coin 1
coin2 = 6  # Coin 2
test = T  # Test (operator menu)
service = 9  # Service
trigger = Space  # Trigger switch (keyboard)
fire = PadRT, PadA  # Fire at the crosshair (controller)
pump = PadLT, PadB  # Pump (controller)
move_x = AxisLX, AxisRX  # Aim X (right) (controller axes: AxisLX/LY/RX/RY/LT/RT, PointerX/Y; - inverts)
move_y = AxisLY, AxisRY  # Aim Y (down) (controller axes: AxisLX/LY/RX/RY/LT/RT, PointerX/Y; - inverts)

[super_cars]  # Fast and Furious Super Cars. Steering ramps while held and recentres on release; gas and brake keys are on/off. Controllers (XInput): left stick steers, triggers bound to gas/brake are analog. Targets are the cabinet I/O board's input codes.
steer_left = Left, PadLeft  # Steer left
steer_right = Right, PadRight  # Steer right
gas = Up, PadRT  # Gas
brake = Down, PadLT  # Brake
start1 = Enter, 1, PadStart, PadA  # Start / select
view1 = C, PadX  # View 1
view2 = V, PadY  # View 2
view3 = B, PadB  # View 3
tunes = M, PadRS  # Music (tunes)
gear1 = Q, PadLB  # Gear 1
gear2 = W, PadRB  # Gear 2
gear3 = E, PadUp  # Gear 3
gear4 = R, PadDown  # Gear 4
coin1 = 5, PadBack  # Coin 1
coin2 = 6  # Coin 2
test = T  # Test (operator menu)
service = 9  # Service
volume_up = PageUp  # Volume up
volume_down = PageDown  # Volume down
move_x = AxisLX  # Steering (right) (controller axes: AxisLX/LY/RX/RY/LT/RT, PointerX/Y; - inverts)
move_y =   # Gas up / brake down (controller axes: AxisLX/LY/RX/RY/LT/RT, PointerX/Y; - inverts)

[ford]  # Ford Racing Full Blown. Keyboard steering ramps and recentres. Controllers (XInput): left stick steers, triggers bound to gas/brake are analog. The cabinet adapter runs on Windows and Wine; Escape exits.
steer_left = Left, PadLeft  # Steer left
steer_right = Right, PadRight  # Steer right
gas = Up, PadRT  # Gas / menu confirm
brake = Down, PadLT  # Brake
start1 = Enter, 1, PadStart, PadA  # Start
view = V, PadY  # Change view
gear_up = Space, PadRB  # Shift up
gear_down = X, PadLB  # Shift down
coin1 = 5, PadBack  # Coin
move_x = AxisLX  # Steering (right) (controller axes: AxisLX/LY/RX/RY/LT/RT, PointerX/Y; - inverts)
move_y =   # Gas up / brake down (controller axes: AxisLX/LY/RX/RY/LT/RT, PointerX/Y; - inverts)
