[package]
name = "banana-super-cars-hook"
version.workspace = true
edition.workspace = true
license.workspace = true

# 32-bit Windows guest library loaded by Wine as the game's dinput8.dll.
# Build: cargo build -p banana-super-cars-hook --target i686-pc-windows-msvc --release
# (linker and panic settings live in .cargo/config.toml).
[lib]
name = "arcade_wine_hook"
crate-type = ["cdylib"]

[[package.metadata.banana.artifacts]]
name="arcade_wine_hook"
kind="lib"
target="i686-pc-windows-msvc"
hosts=["linux"]
destination="games/super-cars/windows-x86/arcade_wine_hook.dll"
