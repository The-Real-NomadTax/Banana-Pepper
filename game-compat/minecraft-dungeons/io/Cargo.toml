[package]
name = "banana-minecraft-io"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Desktop keyboard, QR scanners and virtual dispenser for Minecraft Dungeons Arcade 3.07"

[lib]
name = "arcade_minecraft_io"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json.workspace=true
banana-input.workspace=true

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
libc = "0.2"

[[package.metadata.banana.artifacts]]
name="arcade_minecraft_io"
kind="lib"
target=""
hosts=["linux"]
destination="games/minecraft/linux-x86_64/libarcade_minecraft_io.so"
