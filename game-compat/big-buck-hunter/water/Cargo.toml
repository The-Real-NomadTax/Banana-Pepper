[package]
name="banana-buck-water-adapter"
version.workspace=true
edition.workspace=true
license.workspace=true
[lib]
name="banana_buck_water"
crate-type=["cdylib"]
[dependencies]
banana-water.workspace=true
banana-input.workspace=true
banana-settings.workspace=true
image={version="0.25.10",default-features=false,features=["png"]}
[target.'cfg(windows)'.dependencies]
windows-sys={version="0.61.2",features=["Win32_Foundation","Win32_System_Memory","Win32_System_Diagnostics_Debug","Win32_System_Kernel","Win32_System_Threading","Win32_Security_Cryptography","Win32_System_LibraryLoader","Win32_Graphics_Gdi","Win32_Graphics_OpenGL","Win32_UI_WindowsAndMessaging","Win32_UI_Input","Win32_Media_Audio","Win32_Media_Multimedia"]}

[[package.metadata.banana.artifacts]]
name="banana_buck_water"
kind="lib"
target="i686-pc-windows-msvc"
hosts=["windows"]
destination="games/big-buck/windows-x86/banana_buck_water.dll"
