[package]
name = "banana-compat"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Registry of the built-in Banana Pepper game compatibility crates"

[dependencies]
banana-api.workspace = true
banana-input.workspace = true
banana-settings.workspace = true
banana-game-aliens-armageddon = { path = "../../game-compat/aliens-armageddon" }
banana-game-big-buck-world = { path = "../../game-compat/big-buck-world" }
banana-game-big-buck-hunter = { path = "../../game-compat/big-buck-hunter" }
banana-game-jurassic-park = { path = "../../game-compat/jurassic-park" }
banana-game-super-cars = { path = "../../game-compat/super-cars" }
banana-game-wangan-midnight-6r = { path = "../../game-compat/wangan-midnight-6r" }
banana-game-ford-racing = { path = "../../game-compat/ford-racing" }

[target.'cfg(target_os = "android")'.dependencies]
banana-android.workspace = true

[target.'cfg(not(target_os = "android"))'.dependencies]
banana-native.workspace = true
banana-wine.workspace = true
banana-water.workspace = true
banana-game-minecraft-dungeons = { path = "../../game-compat/minecraft-dungeons" }
banana-game-skylanders-cloud-patrol = { path = "../../game-compat/skylanders-cloud-patrol" }

[dev-dependencies]
banana-content.workspace = true
banana-core.workspace = true
banana-runtime.workspace = true
