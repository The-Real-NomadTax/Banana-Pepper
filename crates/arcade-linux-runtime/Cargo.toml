[package]
name = "arcade-linux-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native x86-64 Linux ABI translation on Windows for Arcade Foundry"

[dependencies]
goblin.workspace = true
serde.workspace = true
serde_json.workspace = true
iced-x86 = { version = "1.22.0", default-features = false, features = ["std", "decoder", "instr_info"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Threading", "Win32_Security_Cryptography"] }

[[bin]]
name = "linux-run"
path = "src/main.rs"
