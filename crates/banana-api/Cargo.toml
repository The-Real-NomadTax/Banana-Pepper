[package]
name = "banana-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Game compatibility and execution backend API for Banana Pepper"

[dependencies]
banana-input.workspace = true
banana-settings.workspace = true
serde.workspace = true
banana-content.workspace = true
sha2.workspace = true
goblin.workspace = true
serde_json.workspace = true
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
