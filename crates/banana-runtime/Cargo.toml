[package]
name = "banana-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Game preparation, launch dispatch and process orchestration for Banana Pepper"

[dependencies]
banana-api.workspace = true
banana-content.workspace = true
banana-core.workspace = true
banana-input.workspace = true
banana-settings.workspace = true
banana-vfs.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ruzstd = "0.8.3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[[package.metadata.banana.artifacts]]
name="banana-session"
kind="bin"
target=""
hosts=["linux"]
destination="helpers/banana-session"
