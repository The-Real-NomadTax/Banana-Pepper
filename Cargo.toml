[workspace]
members = ["crates/arcade-core", "crates/arcade-desktop", "crates/arcade-linux-shim", "crates/arcade-linux-runtime"]
default-members = ["crates/arcade-desktop"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
arcade-core = { path = "crates/arcade-core" }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
goblin = "0.10.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
