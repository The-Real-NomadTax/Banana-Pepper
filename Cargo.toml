[workspace]
# Each game owns game-compat/<game>/ and its adapter crates beside it.
members = [
    "crates/*",
    "apps/desktop",
    "backends/android",
    "backends/native",
    "backends/wine",
    "backends/water",
    "guest/linux-shim",
    "guest/view-shim",
    "game-compat/*",
    "game-compat/*/guest",
    "game-compat/*/hook",
    "game-compat/*/io",
    "tools/xtask",
]
default-members = ["apps/desktop"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Shared framework
banana-api = { path = "crates/banana-api" }
banana-core = { path = "crates/banana-core" }
banana-compat = { path = "crates/banana-compat" }
banana-runtime = { path = "crates/banana-runtime" }
banana-settings = { path = "crates/banana-settings" }
banana-input = { path = "crates/banana-input" }
banana-content = { path = "crates/banana-content" }
banana-vfs = { path = "crates/banana-vfs" }
banana-wire = { path = "crates/banana-wire" }
# Execution backends
banana-android = { path = "backends/android" }
banana-native = { path = "backends/native" }
banana-wine = { path = "backends/wine" }
banana-water = { path = "backends/water" }
# Third party
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
goblin = "0.10.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
