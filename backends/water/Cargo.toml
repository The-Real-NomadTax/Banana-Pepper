[package]
name = "banana-water"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Water Adapts The ELF Runtime: Linux-to-Windows compatibility for Banana pepper"

[dependencies]
goblin.workspace = true
serde.workspace = true
serde_json.workspace = true
banana-api.workspace = true
banana-input.workspace = true
banana-settings.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png"] }
iced-x86 = { version = "1.22.0", default-features = false, features = ["std", "decoder", "instr_info"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Threading", "Win32_Security_Cryptography", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_Graphics_OpenGL", "Win32_UI_WindowsAndMessaging", "Win32_Media_Audio", "Win32_Media_Multimedia"] }

[[bin]]
name = "water"
path = "src/main.rs"

[[bin]]
name = "water-buck"
path = "src/buck_main.rs"
