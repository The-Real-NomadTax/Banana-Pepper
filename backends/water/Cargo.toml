[package]
name = "banana-water"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Water Adapts The ELF Runtime: Linux-to-Windows compatibility for Banana pepper"

[dependencies]
goblin.workspace = true
serde.workspace = true
serde_json.workspace = true
banana-api.workspace = true
banana-content.workspace = true
banana-wire.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png"] }
iced-x86 = { version = "1.22.0", default-features = false, features = ["std", "decoder", "instr_info"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Threading", "Win32_Security_Cryptography", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_Graphics_OpenGL", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_Media_Audio", "Win32_Media_Multimedia"] }

[dev-dependencies]
banana-vfs.workspace = true

[[bin]]
name="water-x64"
path="src/worker.rs"
[[bin]]
name="water-x86"
path="src/worker32.rs"

[[package.metadata.banana.artifacts]]
name="water-x64"
kind="bin"
target=""
hosts=["windows"]
destination="helpers/water-x64.exe"

[[package.metadata.banana.artifacts]]
name="water-x86"
kind="bin"
target="i686-pc-windows-msvc"
hosts=["windows"]
destination="helpers/water-x86.exe"
