[package]
name = "banana-native"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native host execution backend for Banana Pepper"

[dependencies]
banana-api.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dependencies.banana-content]
workspace=true

[dependencies.banana-input]
workspace=true
[dependencies.serde_json]
workspace=true

[dev-dependencies]
goblin.workspace = true
banana-vfs.workspace = true
tempfile = "3"

[[package.metadata.banana.artifacts]]
name="banana-sandbox"
kind="bin"
target=""
hosts=["linux"]
destination="helpers/banana-sandbox"
