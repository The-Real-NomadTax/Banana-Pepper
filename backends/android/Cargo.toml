[package]
name = "banana-android"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Android Box64/Wine process and display transport for shared mounted sessions"
[dependencies]
banana-api.workspace = true
banana-content.workspace = true

# The display/audio bridges (also built on Linux, where their tests run).
[target.'cfg(any(target_os = "android", target_os = "linux"))'.dependencies]
libc = "0.2"
x11rb = { version = "0.13.2", default-features = false, features = ["shm", "xtest"] }
