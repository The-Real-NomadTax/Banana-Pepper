# Arcade Foundry per-game settings. Edit here or in each game's Settings window.
# Key bindings live in controls.cfg. Changes apply the next time a game starts.

[aliens]  # Aliens Armageddon
resolution = 1920x1080
fullscreen = true
vsync = default  # default | on | off
renderer = gpu  # gpu | software
audio = true
audio_sink =   # PulseAudio/PipeWire sink; empty = default output

[jurassic]  # Jurassic Park 2015
resolution = 1920x1080
fullscreen = true
vsync = default  # default | on | off
renderer = gpu  # gpu | software
audio = true
audio_sink =   # PulseAudio/PipeWire sink; empty = default output

[big_buck]  # Big Buck Hunter Pro
backend = water
resolution = 640x480
fullscreen = false
vsync = off  # default | on | off
renderer = gpu  # gpu | software
audio = true
audio_sink =   # PulseAudio/PipeWire sink; empty = default output

[super_cars]  # Fast and Furious Super Cars
resolution = 1920x1080
fullscreen = false
vsync = default  # default | on | off
renderer = gpu  # gpu | software
audio = false
audio_sink =   # PulseAudio/PipeWire sink; empty = default output

[ford]
audio = false
