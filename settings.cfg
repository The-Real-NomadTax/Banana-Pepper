# Banana pepper per-game settings. Edit here or in each game's Settings window.
# Key bindings live in controls.cfg. Changes apply the next time a game starts.

[aliens]  # Aliens Armageddon
resolution = 1920x1080
backend = auto  # auto | water | wsl (games with a backend choice on Windows)
fullscreen = true
vsync = default  # default | on | off
renderer = gpu  # gpu | software
audio = true
audio_sink =   # PulseAudio/PipeWire sink; empty = default output
players = 1  # 1 | 2 (controller 2 drives player two)

[jurassic]  # Jurassic Park 2015
resolution = 1920x1080
backend = auto  # auto | water | wsl (games with a backend choice on Windows)
fullscreen = true
vsync = default  # default | on | off
renderer = gpu  # gpu | software
audio = true
audio_sink =   # PulseAudio/PipeWire sink; empty = default output
players = 2  # 1 | 2 (controller 2 drives player two)

[big_buck]  # Big Buck Hunter Pro
resolution = 1920x1080
backend = water  # auto | water | wsl (games with a backend choice on Windows)
fullscreen = true
vsync = off  # default | on | off
renderer = gpu  # gpu | software
audio = true
audio_sink =   # PulseAudio/PipeWire sink; empty = default output
crosshair = p1  # off | p1 | p1_large | p2 | p2_large
crosshair_size = 25  # percent, 10 to 200
players = 2  # 1 | 2 (controller 2 drives player two)

[super_cars]  # Fast and Furious Super Cars
resolution = 1920x1080
backend = auto  # auto | water | wsl (games with a backend choice on Windows)
fullscreen = false
vsync = default  # default | on | off
renderer = gpu  # gpu | software
audio = false
audio_sink =   # PulseAudio/PipeWire sink; empty = default output

[ford]  # Ford Racing Full Blown
resolution = 640x480
backend = auto  # auto | water | wsl (games with a backend choice on Windows)
fullscreen = false
vsync = default  # default | on | off
renderer = gpu  # gpu | software
audio = false
audio_sink =   # PulseAudio/PipeWire sink; empty = default output
