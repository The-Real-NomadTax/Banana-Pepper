[package]
name = "banana-zar"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Game folder to ZArchive desktop converter"

[dependencies]
banana-content.workspace = true
eframe.workspace = true
rfd = "0.17.2"

[[bin]]
name = "arcade-zar"
path = "src/main.rs"

[[package.metadata.banana.artifacts]]
name="arcade-zar"
kind="bin"
target=""
hosts=["windows", "linux"]
destination="arcade-zar{exe}"
